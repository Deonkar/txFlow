<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#f6f8fa" rx="8"/>
  <text x="28" y="38" font-size="17" font-weight="600" fill="#1f2328">TxFlow — payment event flow</text>
  <text x="28" y="58" font-size="12.5" fill="#656d76">One request, one event, five independent consumer groups.</text>

  <rect x="28" y="92" width="104" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="80" y="120" font-size="13" fill="#1f2328" text-anchor="middle">Client</text>

  <rect x="168" y="92" width="168" height="46" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="252" y="113" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">FastAPI producer</text>
  <text x="252" y="130" font-size="11.5" fill="#57606a" text-anchor="middle">POST /payment</text>

  <rect x="372" y="92" width="168" height="46" rx="6" fill="#1f2328" stroke="#1f2328"/>
  <text x="456" y="113" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Redpanda / Kafka</text>
  <text x="456" y="130" font-size="11.5" fill="#b1bac4" text-anchor="middle">payments topic</text>

  <line x1="132" y1="115" x2="162" y2="115" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="336" y1="115" x2="366" y2="115" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>

  <path d="M540,115 C580,115 590,84 626,84" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M540,115 C580,115 590,134 626,134" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M540,115 C580,115 590,184 626,184" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M540,115 C580,115 590,234 626,234" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M540,115 C580,115 590,284 626,284" fill="none" stroke="#6e7781" stroke-width="1.4" marker-end="url(#a)"/>

  <text x="742" y="52" font-size="11" fill="#656d76" text-anchor="middle">independent consumer groups</text>

  <rect x="632" y="62" width="220" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="742" y="82" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">fraud</text>
  <text x="742" y="97" font-size="10.5" fill="#57606a" text-anchor="middle">scoring, holds</text>

  <rect x="632" y="112" width="220" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="742" y="132" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">wallet</text>
  <text x="742" y="147" font-size="10.5" fill="#57606a" text-anchor="middle">balance debit / credit</text>

  <rect x="632" y="162" width="220" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="742" y="182" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">notifications</text>
  <text x="742" y="197" font-size="10.5" fill="#57606a" text-anchor="middle">email / SMS fan-out</text>

  <rect x="632" y="212" width="220" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="742" y="232" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">audit</text>
  <text x="742" y="247" font-size="10.5" fill="#57606a" text-anchor="middle">immutable event log</text>

  <rect x="632" y="262" width="220" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="742" y="282" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">analytics</text>
  <text x="742" y="297" font-size="10.5" fill="#57606a" text-anchor="middle">counters, aggregates</text>

  <rect x="372" y="176" width="168" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="456" y="196" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Redis</text>
  <text x="456" y="211" font-size="10.5" fill="#57606a" text-anchor="middle">dedup keys + counters</text>

  <rect x="372" y="236" width="168" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="456" y="256" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">PostgreSQL</text>
  <text x="456" y="271" font-size="10.5" fill="#57606a" text-anchor="middle">payments, ledger</text>

  <line x1="626" y1="198" x2="546" y2="198" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="626" y1="258" x2="546" y2="258" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <path d="M742,306 L742,352" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="752" y="332" font-size="10.5" fill="#bc4c00">retries exhausted</text>

  <rect x="632" y="358" width="220" height="46" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="742" y="379" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">dead-letter queue</text>
  <text x="742" y="395" font-size="10.5" fill="#57606a" text-anchor="middle">poison messages parked</text>

  <rect x="372" y="358" width="168" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="456" y="379" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">DLQ handler</text>
  <text x="456" y="395" font-size="10.5" fill="#57606a" text-anchor="middle">inspect, replay</text>

  <line x1="626" y1="381" x2="546" y2="381" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="28" y="358" width="168" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="112" y="379" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Next.js dashboard</text>
  <text x="112" y="395" font-size="10.5" fill="#57606a" text-anchor="middle">live throughput + DLQ</text>

  <path d="M252,138 L252,381 L202,381" fill="none" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <text x="28" y="440" font-size="11.5" fill="#656d76">Delivery is at-least-once: every consumer retries independently, dedups on a Redis key, and parks what it cannot process.</text>
  <text x="28" y="457" font-size="11.5" fill="#656d76">A failure in one group never blocks the other four.</text>
</svg>
